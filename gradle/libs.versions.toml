# File:    libs.versions.toml
# Module:  escpos-indic
# Purpose: Single pinned version catalog (test and build tools only; the only runtime dependency is ZXing core).
# Plan:    L3
#
# Versions copied from the ShopSuite catalog, newest stable on Maven Central checked 2026-10-18.

[versions]
zxing = "3.5.4"            # Apache-2.0 (pom header and project LICENSE); released 2025-11-11; runtime, barcode rasters only
junit = "6.1.3"            # EPL-2.0; test only
assertj = "3.27.7"         # Apache-2.0; test only
jqwik = "1.10.2"           # EPL-2.0; test only
archunit = "1.5.1"         # Apache-2.0; test only
checkstyle = "14.3.0"      # LGPL-2.1; build only
google-java-format = "1.36.1" # Apache-2.0; build only (1.37.0 fails under Spotless 8.9.0)
pitest-junit5 = "1.2.3"    # Apache-2.0; build only
plugin-spotless = "8.9.0"  # Apache-2.0
plugin-pitest = "1.19.0"   # Apache-2.0

[libraries]
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }
pitest = { id = "info.solidsoft.pitest", version.ref = "plugin-pitest" }
