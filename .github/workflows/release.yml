name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check pitest jar sourcesJar javadocJar -PreleaseVersion=${GITHUB_REF_NAME#v} --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
